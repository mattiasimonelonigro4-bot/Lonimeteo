<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LONImeteo Aero-Precision</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LONImeteo">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/869/869869.png">

    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff9500; --accent: #af52de;
            --glass: rgba(18, 18, 28, 0.92); --border: rgba(255, 255, 255, 0.12);
            --bg-blur: blur(50px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'SF Pro Display', sans-serif; color: #fff; height: 100vh; overflow: hidden; background: #000; transition: background 2s ease; position: relative;}

        #launchScreen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        .launch-logo { font-size: 48px; font-weight: 800; letter-spacing: -2px; animation: pulse 2s ease-in-out infinite; }
        .launch-logo i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }

        #cloudLayer {
            position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 2s ease; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><path d="M150,150 a50,50 0 0,1 100,0 a60,60 0 0,1 120,0 a50,50 0 0,1 100,0 Z" fill="white" opacity="0.3"/></svg>');
            background-size: 150% auto; animation: driftClouds 60s linear infinite;
        }
        @keyframes driftClouds { from { background-position: 0% 20%; } to { background-position: 100% 20%; } }

        .bg-notte { background: radial-gradient(circle at top, #1a1a2e, #020111) !important; }
        .bg-giorno { background: radial-gradient(circle at top, #4facfe, #001f3f) !important; }

        .app-container { height: 100vh; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 20px) 22px; position: relative; z-index: 5; }
        .brand-text { font-size: 32px; font-weight: 800; text-align: center; flex: 1; }
        .brand-text i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .loc-chip { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 10px 18px; border-radius: 30px; margin: 10px auto 20px; width: fit-content; border: 1px solid var(--border); backdrop-filter: var(--bg-blur); }

        .content-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 60px; scrollbar-width: none; }
        .content-scroll::-webkit-scrollbar { display: none; }

        .hero { text-align: center; padding: 10px 0 25px; }
        .main-icon { font-size: 95px; animation: float 4s ease-in-out infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .main-temp { font-size: 115px; font-weight: 200; letter-spacing: -7px; line-height: 0.9; }

        .glass-card { background: var(--glass); backdrop-filter: var(--bg-blur); border-radius: 35px; border: 1px solid var(--border); padding: 25px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .info-item { background: var(--glass); border-radius: 30px; padding: 22px; border: 1px solid var(--border); }
        .info-item label { font-size: 11px; font-weight: 800; opacity: 0.4; letter-spacing: 1.2px; display: block; margin-bottom: 6px; text-transform: uppercase; }
        .info-val { font-size: 26px; font-weight: 700; }
        
        #settingsPanel, .overlay { position: fixed; inset: 0; background: #08080c; z-index: 6000; display: none; flex-direction: column; padding: env(safe-area-inset-top, 40px) 25px; }
    </style>
</head>
<body class="bg-notte">

<div id="launchScreen"><div class="launch-logo">LONI<i>meteo</i></div></div>
<div id="cloudLayer"></div>

<div class="app-container">
    <div style="display:flex; align-items:center;">
        <div style="width:30px"></div>
        <div class="brand-text">LONI<i>meteo</i></div>
        <div onclick="toggleSettings(true)" style="font-size: 28px;">⚙️</div>
    </div>

    <div class="loc-chip" onclick="locateMe()">📍 <span id="locPrecise">Barletta, Puglia</span></div>

    <div class="content-scroll">
        <div class="hero">
            <div id="mainIcon" class="main-icon">☀️</div>
            <div class="main-temp" id="tempDisplay">18°</div>
            <p id="mainStatus" style="font-size:22px; font-weight:600; color: var(--primary);">Cielo Sereno</p>
        </div>
        <div class="glass-card"><div id="forecastTarget"></div></div>
        <div class="info-grid">
            <div class="info-item"><label>Umidità</label><div class="info-val">64%</div></div>
            <div class="info-item"><label>Pressione</label><div class="info-val">1014</div></div>
        </div>
    </div>
</div>

<script>
    // Registrazione Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // Launch Screen
    window.addEventListener('load', () => {
        setTimeout(() => {
            const launch = document.getElementById('launchScreen');
            launch.style.opacity = '0';
            setTimeout(() => launch.style.visibility = 'hidden', 800);
        }, 2200);
    });

    function updateApp() {
        const h = new Date().getHours();
        const b = document.body;
        if (h >= 8 && h < 18) {
            b.className = 'bg-giorno';
            document.getElementById('mainIcon').innerText = "☀️";
        } else {
            b.className = 'bg-notte';
            document.getElementById('mainIcon').innerText = "🌙";
        }
    }
    
    function toggleSettings(s) { document.getElementById('settingsPanel').style.display = s ? 'flex' : 'none'; }
    function locateMe() { document.getElementById('locPrecise').innerText = "Barletta (BT), 41.31°N"; }
    
    updateApp();
</script>
</body>
</html>
