<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LONImeteo - Configurazione Finale v1.3</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9500; --accent: #af52de;
            --glass: rgba(18, 18, 28, 0.85); --border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'SF Pro Display', sans-serif; color: #fff; height: 100vh; overflow: hidden; background: #000; transition: background 2s ease; }

        .bg-notte { background: radial-gradient(circle at top, #1a1a2e, #020111) !important; }
        .bg-alba { background: radial-gradient(circle at top, #ff9a9e, #2f3542) !important; }
        .bg-giorno { background: radial-gradient(circle at top, #4facfe, #001f3f) !important; }
        .bg-tramonto { background: radial-gradient(circle at top, #fd746c, #2c3e50) !important; }

        .app-container { height: 100vh; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 20px) 22px; position: relative; z-index: 5; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .brand-text { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; flex: 1; text-align: center; margin-left: 35px; }
        .brand-text i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .loc-chip { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 10px 18px; border-radius: 30px; margin: 10px auto 20px; width: fit-content; border: 1px solid var(--border); backdrop-filter: blur(15px); cursor: pointer; }

        .content-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 18px; padding-bottom: 60px; }
        .content-scroll::-webkit-scrollbar { display: none; }

        .hero { text-align: center; padding: 10px 0 25px; }
        .main-icon { font-size: 95px; filter: drop-shadow(0 0 35px rgba(255,255,255,0.25)); animation: float 4s ease-in-out infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .main-temp { font-size: 115px; font-weight: 200; letter-spacing: -7px; line-height: 0.9; margin: 15px 0 5px; }

        .glass-card { background: var(--glass); backdrop-filter: blur(50px); border-radius: 35px; border: 1px solid var(--border); padding: 25px; }

        .forecast-row { display: grid; grid-template-columns: 85px 1fr 85px; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
        .f-day { font-weight: 600; font-size: 17px; opacity: 0.9; }
        .f-icon { font-size: 24px; text-align: center; }
        .f-temp { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .info-item { background: var(--glass); border-radius: 30px; padding: 22px; border: 1px solid var(--border); cursor: pointer; }
        .info-item label { font-size: 11px; font-weight: 800; opacity: 0.4; letter-spacing: 1.2px; display: block; margin-bottom: 6px; text-transform: uppercase; }
        .info-val { font-size: 26px; font-weight: 700; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: none; flex-direction: column; padding: 65px 24px; animation: slideUp 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .close-btn { font-size: 48px; color: var(--primary); cursor: pointer; align-self: flex-end; line-height: 0.8; }

        /* IMPOSTAZIONI RIPRISTINATE */
        #settingsPanel { position: fixed; inset: 0; background: #08080c; z-index: 6000; display: none; flex-direction: column; padding: env(safe-area-inset-top, 20px) 25px; overflow-y: auto; }
        .settings-group { margin-bottom: 30px; }
        .settings-label { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body class="bg-notte">

<div class="app-container">
    <div class="header">
        <div style="width:30px"></div>
        <div class="brand-text">LONI<i>meteo</i></div>
        <div onclick="toggleSettings(true)" style="font-size: 28px; cursor:pointer;">⚙️</div>
    </div>

    <div class="loc-chip" onclick="locateMe()">
        <span>📍</span>
        <span id="locPrecise">Barletta, Puglia</span>
    </div>

    <div class="content-scroll">
        <div class="hero">
            <div id="mainIcon" class="main-icon">☀️</div>
            <div class="main-temp" id="tempDisplay">18°</div>
            <p id="mainStatus" style="font-size:22px; font-weight:600; color: var(--primary);">Cielo Sereno</p>
        </div>

        <div class="glass-card">
            <h3 style="font-size:11px; opacity:0.4; margin-bottom:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;">Tendenza 7 Giorni</h3>
            <div id="forecastTarget"></div>
        </div>

        <div class="info-grid">
            <div class="info-item" onclick="openParam('Umidità', 'L\'aria è così umida che potresti nuotare fino al bar. Ottima per i capelli ricci (o per sembrare un leone).', '💧', 'linear-gradient(135deg, #2193b0, #6dd5ed)', '64%')">
                <label>Umidità</label><div class="info-val">64%</div>
            </div>
            <div class="info-item" onclick="openParam('Pressione', '1014 hPa. Il cielo ci sta schiacciando con grazia. Niente mal di testa per oggi, pilota!', '⏲️', 'linear-gradient(135deg, #1e3c72, #2a5298)', '1014')">
                <label>Pressione</label><div class="info-val">1014</div>
            </div>
            <div class="info-item" onclick="openParam('Visibilità', 'Vedi talmente lontano che potresti scorgere il tuo futuro (spoiler: è radioso). >10km garantiti.', '👁️', 'linear-gradient(135deg, #3a1c71, #d76d77)', '>10km')">
                <label>Visibilità</label><div class="info-val">>10km</div>
            </div>
            <div class="info-item" onclick="openParam('Indice UV', 'Il sole oggi è timido. Puoi uscire senza sembrare un peperone grigliato entro dieci minuti.', '☀️', 'linear-gradient(135deg, #f093fb, #f5576c)', 'Lieve')">
                <label>Indice UV</label><div class="info-val">Lieve</div>
            </div>
        </div>

        <div class="glass-card" onclick="openAstronomia()" style="display:flex; align-items:center; gap:20px; background: linear-gradient(135deg, rgba(175,82,222,0.15), var(--glass));">
            <div style="font-size:45px;">🌕</div>
            <div>
                <label style="font-size:10px; font-weight:800; opacity:0.5; letter-spacing:1px;">ASTRONOMIA</label>
                <div style="font-size:20px; font-weight:700;">Luna Piena (98%)</div>
            </div>
        </div>
    </div>
</div>

<div id="settingsPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-size:36px; font-weight:800;">Controllo</h2>
        <div class="close-btn" onclick="toggleSettings(false)">×</div>
    </div>

    <div class="settings-group">
        <label class="settings-label">Localizzazione</label>
        <div class="setting-row">
            <div><b>GPS Alta Precisione</b><br><span style="font-size:12px; opacity:0.5;">Sincronizzazione Barletta</span></div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
    </div>

    <div class="settings-group">
        <label class="settings-label">Unità</label>
        <div class="setting-row" onclick="alert('Unità bloccate su Sistema Metrico Aeronautico')">
            <b>Scala Temperature</b>
            <span style="color:var(--primary)">Celsius (°C)</span>
        </div>
    </div>

    <div class="settings-group">
        <label class="settings-label">Supporto</label>
        <div class="setting-row" onclick="alert('Segnalazione inviata con successo!')"><b>🪲 Segnala un Bug</b></div>
        <div class="setting-row" onclick="alert('Un esperto ti risponderà a breve (forse)')"><b>🎧 Assistenza Diretta</b></div>
    </div>

    <div style="text-align:center; padding: 40px 0; color:#ff3b30; font-weight:800; cursor:pointer;" onclick="toggleSettings(false)">CHIUDI IMPOSTAZIONI</div>
</div>

<div class="overlay" id="mainOverlay">
    <div class="close-btn" onclick="closeOverlay()">×</div>
    <div id="ovContent" style="flex:1; overflow-y:auto; line-height:1.7; font-size:19px;"></div>
</div>

<script>
    function updateApp() {
        const h = new Date().getHours();
        const b = document.body;
        const icon = document.getElementById('mainIcon');
        const status = document.getElementById('mainStatus');
        let iconChar = "☀️";
        if (h >= 5 && h < 8) b.className = 'bg-alba';
        else if (h >= 8 && h < 18) b.className = 'bg-giorno';
        else if (h >= 18 && h < 21) b.className = 'bg-tramonto';
        else { b.className = 'bg-notte'; iconChar = "🌙"; }
        icon.innerText = iconChar;
        status.innerText = (iconChar === "🌙") ? "Notte Serena" : "Cielo Sereno";

        const forecast = ["Oggi","Dom","Mar","Mer","Gio","Ven","Sab"];
        document.getElementById('forecastTarget').innerHTML = forecast.map(d => `
            <div class="forecast-row" onclick="openHourly('${d}')">
                <span class="f-day">${d}</span>
                <span class="f-icon">${iconChar}</span>
                <span class="f-temp">22° 12°</span>
            </div>
        `).join('');
    }

    function openHourly(day) {
        const h = new Date().getHours();
        let html = `<h2 style="font-size:32px; color:var(--primary); margin-bottom:20px;">${day}</h2>`;
        for (let i = h + 1; i <= 23; i++) {
            const hIcon = (i >= 20 || i < 6) ? "🌙" : "☀️";
            const temp = Math.round(18 - (i-h)*0.8);
            html += `<div style="display:grid; grid-template-columns: 80px 1fr 80px; align-items:center; padding:15px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                <span>${i}:00</span><span style="text-align:center; font-size:20px;">${hIcon}</span><span style="text-align:right; font-weight:700;">${temp}°</span>
            </div>`;
        }
        showOv(html);
    }

    function openParam(title, desc, emoji, bg, val) {
        showOv(`<div style="font-size:60px; margin-bottom:20px;">${emoji}</div><h2 style="font-size:32px; color:var(--primary); margin-bottom:10px;">${title}</h2><p style="font-size:28px; font-weight:700; margin-bottom:15px;">${val}</p><p style="opacity:0.9;">${desc}</p>`);
    }

    function openAstronomia() {
        showOv(`<h2 style="font-size:32px; color:var(--primary); margin-bottom:15px;">Astronomia</h2><p>Luna Piena al 98%. Perfetta per trasformarsi in lupi mannari o semplicemente per una passeggiata romantica senza inciampare.</p>`);
    }

    function showOv(content) {
        document.getElementById('ovContent').innerHTML = content;
        document.getElementById('mainOverlay').style.display = 'flex';
    }

    function closeOverlay() { document.getElementById('mainOverlay').style.display = 'none'; }
    function toggleSettings(s) { document.getElementById('settingsPanel').style.display = s ? 'flex' : 'none'; }
    function locateMe() { document.getElementById('locPrecise').innerText = "Barletta (BT), 41.31°N"; }

    updateApp();
    setInterval(updateApp, 60000);
</script>
</body>
</html>
