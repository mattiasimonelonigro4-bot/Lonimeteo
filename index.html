<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LONImeteo Aero-Precision</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LONImeteo">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/869/869869.png">

    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff9500; --accent: #af52de; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'SF Pro Display', sans-serif; color: #fff; height: 100vh; overflow: hidden; background: #000; }
        .bg-notte { background: radial-gradient(circle at top, #1a1a2e, #020111); }
        .bg-giorno { background: radial-gradient(circle at top, #4facfe, #001f3f); }

        .app-container { height: 100vh; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 20px) 22px; position: relative; z-index: 5; }
        .brand-text { font-size: 32px; font-weight: 800; text-align: center; flex: 1; }
        .brand-text i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .loc-chip { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 10px 18px; border-radius: 30px; margin: 10px auto 20px; width: fit-content; border: 1px solid var(--border); backdrop-filter: blur(20px); font-size: 14px; }

        .content-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 40px; }
        .hero { text-align: center; padding: 10px 0 25px; }
        .main-icon { font-size: 95px; margin-bottom: 10px; }
        .main-temp { font-size: 115px; font-weight: 200; letter-spacing: -7px; line-height: 0.9; }

        .forecast-row { display: flex; overflow-x: auto; gap: 20px; padding: 15px 5px; scrollbar-width: none; }
        .forecast-row::-webkit-scrollbar { display: none; }
        .f-item { text-align: center; min-width: 55px; }
        .f-time { font-size: 12px; opacity: 0.6; margin-bottom: 8px; }
        .f-icon { font-size: 24px; margin-bottom: 8px; }
        .f-temp { font-weight: 700; font-size: 16px; }

        .glass-card { background: var(--glass); backdrop-filter: blur(30px); border-radius: 30px; border: 1px solid var(--border); padding: 15px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .info-item { background: var(--glass); border-radius: 25px; padding: 20px; border: 1px solid var(--border); backdrop-filter: blur(30px); }
        .info-item label { font-size: 10px; font-weight: 800; opacity: 0.4; letter-spacing: 1.2px; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .info-val { font-size: 24px; font-weight: 700; }
        
        #launchScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: 0.8s; }
    </style>
</head>
<body class="bg-notte">

<div id="launchScreen"><div style="font-size:32px; font-weight:800;">LONI<i>meteo</i></div></div>

<div class="app-container">
    <div style="display:flex; align-items:center;">
        <div style="width:30px"></div>
        <div class="brand-text">LONI<i>meteo</i></div>
        <div style="font-size: 24px; opacity: 0.5;">⚙️</div>
    </div>

    <div class="loc-chip">📍 Barletta (BT), 41.31°N</div>

    <div class="content-scroll">
        <div class="hero">
            <div id="mainIcon" class="main-icon">🌙</div>
            <div class="main-temp">18°</div>
            <p style="font-size:22px; font-weight:600; color: var(--primary);">Cielo Sereno</p>
        </div>

        <div class="glass-card">
            <div class="forecast-row" id="forecastTarget">
                </div>
        </div>

        <div class="info-grid">
            <div class="info-item"><label>Umidità</label><div class="info-val">64%</div></div>
            <div class="info-item"><label>Pressione</label><div class="info-val">1014</div></div>
        </div>
    </div>
</div>

<script>
    // Gestione Schermata Iniziale
    window.addEventListener('load', () => {
        setTimeout(() => { 
            const ls = document.getElementById('launchScreen');
            if(ls) {
                ls.style.opacity = '0'; 
                setTimeout(() => ls.style.display = 'none', 800);
            }
        }, 1500);
    });

    // Riempimento Rettangolo Previsioni
    const target = document.getElementById('forecastTarget');
    const hours = ["03", "04", "05", "06", "07", "08", "09"];
    const icons = ["🌙", "🌙", "🌙", "🌅", "☀️", "☀️", "☀️"];
    const temps = ["17°", "16°", "16°", "17°", "19°", "21°", "23°"];

    let html = "";
    for(let i=0; i<hours.length; i++) {
        html += `<div class="f-item">
            <div class="f-time">${hours[i]}:00</div>
            <div class="f-icon">${icons[i]}</div>
            <div class="f-temp">${temps[i]}</div>
        </div>`;
    }
    if(target) target.innerHTML = html;

    // Sfondo dinamico in base all'ora
    const h = new Date().getHours();
    const mainIcon = document.getElementById('mainIcon');
    if (h > 6 && h < 19) {
        document.body.className = "bg-giorno";
        if(mainIcon) mainIcon.innerText = "☀️";
    } else {
        document.body.className = "bg-notte";
        if(mainIcon) mainIcon.innerText = "🌙";
    }
</script>
</body>
</html>
