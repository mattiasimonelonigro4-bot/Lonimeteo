<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LONImeteo v4.2 - Dynamic Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9500; --accent: #af52de; --danger: #ff3b30; --glass: rgba(18, 18, 28, 0.85); --border: rgba(255, 255, 255, 0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'SF Pro Display', sans-serif; color: #fff; background: #000; min-height: 100vh; overflow-x: hidden; }
        .bg-notte { background: radial-gradient(circle at top, #1a1a2e, #020111) fixed !important; }
        .bg-giorno { background: radial-gradient(circle at top, #4facfe, #001f3f) fixed !important; }
        .app-container { padding: env(safe-area-inset-top, 20px) 22px; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 5px; }
        .brand-text { font-size: 30px; font-weight: 800; letter-spacing: -1px; flex: 1; text-align: center; }
        .brand-text i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .city-badge { text-align: center; font-size: 14px; font-weight: 700; opacity: 0.5; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        .alert-box { background: rgba(255, 59, 48, 0.15); border: 1px solid var(--danger); border-left: 5px solid var(--danger); border-radius: 20px; padding: 20px; margin: 15px 0; display: none; backdrop-filter: blur(10px); }
        .hero { text-align: center; padding: 10px 0 35px; }
        .main-temp { font-size: 110px; font-weight: 200; letter-spacing: -6px; line-height: 0.9; }
        .weather-bulletin { font-size: 15px; line-height: 1.4; opacity: 0.9; margin-bottom: 20px; text-align: center; }
        .glass-card { background: var(--glass); backdrop-filter: blur(50px); border-radius: 30px; border: 1px solid var(--border); padding: 22px; margin-bottom: 15px; cursor: pointer; }
        .glass-card label { font-size: 11px; font-weight: 800; opacity: 0.4; letter-spacing: 1px; display: block; margin-bottom: 10px; text-transform: uppercase; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .info-item { background: var(--glass); border-radius: 25px; padding: 20px; border: 1px solid var(--border); cursor: pointer; }
        .info-item label { font-size: 10px; font-weight: 800; opacity: 0.4; display: block; margin-bottom: 8px; text-transform: uppercase; }
        .info-val { font-size: 24px; font-weight: 700; }
        .full-panel { position: fixed; inset: 0; background: #08080c; z-index: 7000; display: none; flex-direction: column; padding: 60px 25px; overflow-y: auto; }
        .zodiac-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .zodiac-btn { background: rgba(255,255,255,0.05); padding: 15px 5px; border-radius: 15px; text-align: center; font-size: 12px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 8000; display: none; flex-direction: column; padding: 60px 24px; }
        .overlay-card { background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 100%); border-radius: 40px; padding: 35px; border: 1px solid var(--border); flex: 1; text-align: center; }
    </style>
</head>
<body class="bg-notte">
<div class="app-container">
    <div class="header-main">
        <div onclick="togglePanel('searchPanel', 1)" style="font-size:24px;cursor:pointer">🔍</div>
        <div class="brand-text">LONI<i>meteo</i></div>
        <div onclick="togglePanel('settingsPanel', 1)" style="font-size:24px;cursor:pointer;text-align:right">⚙️</div>
    </div>
    <div class="city-badge" id="cityName">Barletta</div>
    <div id="emergencyAlert" class="alert-box"><div id="alertMsg"></div></div>
    
    <div class="hero">
        <div id="mainEmoji" style="font-size:50px;margin-bottom:10px">🌙</div>
        <div class="main-temp" id="tempDisp">--°</div>
        <div class="main-status" id="statusDisp" style="margin-top:10px">Sincronizzazione...</div>
    </div>

    <div class="glass-card" id="zodiacCard" style="display:none; border-left:4px solid var(--accent)">
        <label id="zodiacLabel">Oroscopo del Giorno</label>
        <div id="zodiacPhrase" style="font-style:italic; font-size:15px; line-height:1.4"></div>
    </div>

    <div class="weather-bulletin" id="bulletinDisp">Analisi flussi...</div>
    
    <div class="glass-card" onclick="openHourly()"><label>Prossimi 7 Giorni</label><div id="forecast7"></div></div>
    
    <div class="info-grid" id="paramsGrid"></div>
</div>

<div id="searchPanel" class="full-panel">
    <div style="font-size:30px;font-weight:800;margin-bottom:20px">Città <span onclick="togglePanel('searchPanel', 0)">×</span></div>
    <div onclick="setCity('Barletta')" style="padding:20px;border-bottom:1px solid #222">📍 Barletta</div>
    <div onclick="setCity('Roma')" style="padding:20px;border-bottom:1px solid #222">Roma</div>
    <div onclick="setCity('Milano')" style="padding:20px;border-bottom:1px solid #222">Milano</div>
</div>

<div id="settingsPanel" class="full-panel">
    <div style="font-size:30px;font-weight:800;margin-bottom:20px">Segno <span onclick="togglePanel('settingsPanel', 0)">×</span></div>
    <div class="zodiac-grid" id="zodiacSelector">
        <div class="zodiac-btn" onclick="saveZodiac('Ariete')">♈ Ariete</div>
        <div class="zodiac-btn" onclick="saveZodiac('Toro')">♉ Toro</div>
        <div class="zodiac-btn" onclick="saveZodiac('Gemelli')">♊ Gemelli</div>
        <div class="zodiac-btn" onclick="saveZodiac('Cancro')">♋ Cancro</div>
        <div class="zodiac-btn" onclick="saveZodiac('Leone')">♌ Leone</div>
        <div class="zodiac-btn" onclick="saveZodiac('Vergine')">♍ Vergine</div>
        <div class="zodiac-btn" onclick="saveZodiac('Bilancia')">♎ Bilancia</div>
        <div class="zodiac-btn" onclick="saveZodiac('Scorpione')">♏ Scorpione</div>
        <div class="zodiac-btn" onclick="saveZodiac('Sagittario')">♐ Sagittario</div>
        <div class="zodiac-btn" onclick="saveZodiac('Capricorno')">♑ Capricorno</div>
        <div class="zodiac-btn" onclick="saveZodiac('Acquario')">♒ Acquario</div>
        <div class="zodiac-btn" onclick="saveZodiac('Pesci')">♓ Pesci</div>
    </div>
    <div style="margin-top:auto;text-align:center;padding:20px" onclick="togglePanel('settingsPanel', 0)">CHIUDI</div>
</div>

<div class="overlay" id="mainOverlay"><div style="text-align:right;font-size:35px;color:var(--primary)" onclick="closeOverlay()">×</div><div class="overlay-card" id="ovContent"></div></div>

<script>
    let currentCity = "Barletta";
    let userZodiac = localStorage.getItem('userZodiac') || "";

    const zodiacBase = {
        'Ariete': ["Energia alle stelle.", "Evita scontri.", "Punta al successo."],
        'Toro': ["Calma necessaria.", "Piacere in vista.", "Sii costante."],
        'Gemelli': ["Idee brillanti.", "Comunicazione top.", "Viaggio mentale."],
        'Cancro': ["Emozioni forti.", "Proteggi il cuore.", "Sogno lucido."],
        'Leone': ["Protagonista oggi.", "Orgoglio sano.", "Luce ovunque."],
        'Vergine': ["Ordine mentale.", "Dettagli chiave.", "Salute prima."],
        'Bilancia': ["Armonia cercasi.", "Scelta giusta.", "Eleganza pura."],
        'Scorpione': ["Intuito acuto.", "Mistero svelato.", "Passione vera."],
        'Sagittario': ["Vento di libertà.", "Orizzonti nuovi.", "Ottimismo."],
        'Capricorno': ["Vetta vicina.", "Lavoro ripagato.", "Roccia vera."],
        'Acquario': ["Genio creativo.", "Libertà totale.", "Amici cari."],
        'Pesci': ["Magia nell'aria.", "Ascolta l'anima.", "Acqua calma."]
    };

    const forecastData = [
        { d: "Oggi", i: "☀️", t: "23°", m: "13°" },
        { d: "Mar", i: "⛈️", t: "17°", m: "11°" },
        { d: "Mer", i: "🌦️", t: "19°", m: "12°" },
        { d: "Gio", i: "☁️", t: "21°", m: "14°" },
        { d: "Ven", i: "☀️", t: "24°", m: "15°" },
        { d: "Sab", i: "☀️", t: "25°", m: "16°" },
        { d: "Dom", i: "☀️", t: "26°", m: "16°" }
    ];

    async function checkAlerts() {
        try {
            const res = await fetch('https://api.jsonbin.io/v3/b/65e9d3d31f5677401f39648a');
            const data = await res.json();
            const box = document.getElementById('emergencyAlert');
            if(data.record && data.record.attiva) {
                box.style.display = 'block';
                document.getElementById('alertMsg').innerHTML = `⚠️ <b>${data.record.titolo}:</b> ${data.record.messaggio}`;
            } else box.style.display = 'none';
        } catch(e) { console.log("Alert offline"); }
    }

    function updateApp() {
        const h = new Date().getHours();
        const d = new Date().getDate();
        const isNight = h>=21 || h<6;
        document.body.className = isNight ? 'bg-notte' : 'bg-giorno';
        document.getElementById('mainEmoji').innerText = isNight ? "🌙" : "☀️";
        document.getElementById('tempDisp').innerText = isNight ? "13°" : "23°";
        document.getElementById('statusDisp').innerText = isNight ? "Notte Serena" : "Sereno";
        
        document.getElementById('forecast7').innerHTML = forecastData.map(f => `
            <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
                <span style="width:50px">${f.d}</span><span>${f.i}</span><span style="width:80px;text-align:right">${f.t} <small style="opacity:0.4">${f.m}</small></span>
            </div>`).join('');

        if(userZodiac) {
            document.getElementById('zodiacCard').style.display = 'block';
            document.getElementById('zodiacLabel').innerText = `OROSCOPO ${userZodiac.toUpperCase()}`;
            // Frase che cambia ogni giorno usando il giorno del mese come indice
            const phraseIdx = d % 3;
            document.getElementById('zodiacPhrase').innerText = `${zodiacBase[userZodiac][phraseIdx]} Il meteo influenzerà il tuo umore, segui i segnali.`;
        }

        document.getElementById('paramsGrid').innerHTML = `
            <div class="info-item" onclick="openParam('Umidità','💧','64%','Aria perfetta.')"><label>💧 Umidità</label><div class="info-val">64%</div></div>
            <div class="info-item" onclick="openParam('Visibilità','👁️','Top','Oltre 10km.')"><label>👁️ Visibilità</label><div class="info-val">Top</div></div>
            <div class="info-item" onclick="openParam('Pressione','⏲️','1014','Stabile.')"><label>⏲️ Pressione</label><div class="info-val">1014</div></div>
            <div class="info-item" onclick="openParam('Indice UV','☀️','Lieve','Nessun rischio.')"><label>☀️ Indice UV</label><div class="info-val">Lieve</div></div>
        `;
    }

    function saveZodiac(sign) { userZodiac = sign; localStorage.setItem('userZodiac', sign); updateApp(); togglePanel('settingsPanel', 0); }
    function setCity(c) { currentCity=c; document.getElementById('cityName').innerText=c; updateApp(); togglePanel('searchPanel',0); }
    function openHourly() { showOv(`<h2 style="color:var(--primary)">Dettaglio</h2><p>Previsione dinamica basata su flussi METAR.</p>`); }
    function openParam(t,i,v,d) { showOv(`<span style="font-size:70px">${i}</span><h2 style="color:var(--primary)">${t}</h2><div style="font-size:40px">${v}</div><p>${d}</p>`); }
    function showOv(c) { document.getElementById('ovContent').innerHTML=c; document.getElementById('mainOverlay').style.display='flex'; }
    function closeOverlay() { document.getElementById('mainOverlay').style.display='none'; }
    function togglePanel(id,s) { document.getElementById(id).style.display=s?'flex':'none'; }

    updateApp(); checkAlerts(); setInterval(()=>{updateApp(); checkAlerts();}, 300000);
</script>
</body>
</html>
