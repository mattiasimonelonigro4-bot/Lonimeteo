<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>LONImeteo v9.20 - TITAN SYMMETRY</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff9500; --a: #af52de; --bg: #000; --card: rgba(25, 25, 35, 0.7); --b: rgba(255, 255, 255, 0.1); --red: #ff3b30; --blue: #007aff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'SF Pro Display', sans-serif; color: #fff; background: var(--bg); height: 100vh; overflow: hidden; }

        #sky { position: fixed; inset: 0; z-index: -2; transition: 3s cubic-bezier(0.4, 0, 0.2, 1); }
        .stars { position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(1px 1px at 15% 15%, #fff, transparent), radial-gradient(1px 1px at 85% 85%, #fff, transparent); background-size: 300px 300px; opacity: 0.1; }

        /* APP CONTAINER - CENTRATURA ASSOLUTA */
        .app { padding: 50px 20px; max-width: 450px; margin: auto; height: 100vh; overflow-y: auto; scrollbar-width: none; text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .brand { font-size: 26px; font-weight: 900; }
        .brand i { font-family: 'Playfair Display'; font-style: italic; background: linear-gradient(90deg, var(--a), var(--p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sf-btn { width: 46px; height: 46px; background: rgba(255,255,255,0.08); border-radius: 50%; border: 1px solid var(--b); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); cursor: pointer; }

        .hero { width: 100%; margin-bottom: 25px; }
        .temp-main { font-size: 110px; font-weight: 200; letter-spacing: -8px; line-height: 0.8; position: relative; display: inline-block; margin: 15px 0; }
        .temp-main::after { content: '°'; position: absolute; top: 10px; right: -30px; font-size: 50px; color: var(--p); }
        .mm-hero { font-size: 15px; font-weight: 700; display: flex; justify-content: center; gap: 15px; opacity: 0.8; }

        /* CARD SETTIMANALE CENTRATA */
        .card { width: 100%; background: var(--card); border-radius: 32px; border: 1px solid var(--b); padding: 22px; margin-bottom: 15px; backdrop-filter: blur(20px); text-align: left; }
        .label-sec { font-size: 10px; font-weight: 900; color: var(--p); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: block; text-align: center; }
        
        .row-day { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .row-day:last-child { border-bottom: none; }
        .day-n { font-weight: 700; width: 85px; }
        .day-e { font-size: 12px; opacity: 0.5; flex: 1; text-align: center; }
        .day-t { text-align: right; font-weight: 800; font-size: 17px; width: 60px; }

        /* GRID TECNICA IN FONDO */
        .grid { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 40px; }
        .box { background: var(--card); border-radius: 28px; padding: 20px; border: 1px solid var(--b); cursor: pointer; }
        .box span { font-size: 9px; font-weight: 900; opacity: 0.5; display: block; margin-bottom: 5px; }
        .box b { font-size: 20px; }

        /* PANNELLI */
        .panel { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; padding: 80px 25px; overflow-y: auto; text-align: left; }
        .close-btn { position: absolute; top: 40px; right: 25px; color: var(--red); font-size: 35px; font-weight: 900; cursor: pointer; }
        
        #bubble { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 380px; background: rgba(15, 15, 25, 0.98); border: 1px solid var(--p); border-radius: 40px; padding: 35px; z-index: 3000; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(50px); text-align: center; }
        #bubble.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .ios-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--b); cursor: pointer; }
        .ios-switch { width: 50px; height: 28px; background: #333; border-radius: 20px; position: relative; transition: 0.3s; }
        .ios-switch::after { content: ''; position: absolute; width: 24px; height: 24px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .ios-switch.on { background: var(--blue); }
        .ios-switch.on::after { left: 24px; }
    </style>
</head>
<body>

<div id="sky"></div>
<div class="stars"></div>

<div class="app">
    <div class="header">
        <div class="sf-btn" onclick="t('search',1)">🔍</div>
        <div class="brand">LONI<i>meteo</i></div>
        <div class="sf-btn" onclick="t('settings',1)">⚙️</div>
    </div>

    <div class="hero">
        <div style="font-weight:900; letter-spacing:4px; color:var(--p); font-size:11px;">📍 <span id="city">BARLETTA</span></div>
        <div id="emoji" style="font-size:80px; margin:5px 0;">☀️</div>
        <div class="temp-main" id="temp">--</div>
        <div class="mm-hero">
            <span>MAX <b id="tMax">--</b></span>
            <span>MIN <b id="tMin" style="color:var(--blue)">--</b></span>
        </div>
        <div id="desc" style="font-weight:700; letter-spacing:2px; opacity:0.6; font-size:13px; text-transform:uppercase;">Sistema Operativo</div>
    </div>

    <div class="card">
        <span class="label-sec">Previsione 7 Giorni</span>
        <div id="forecast"></div>
    </div>

    <div class="grid">
        <div class="box" onclick="sb('UV Index')"><span>☀️ UV Index</span><b>8.5</b></div>
        <div class="box" onclick="sb('Umidità')"><span>💧 Umidità</span><b id="hum">--</b></div>
        <div class="box" onclick="sb('Vento')"><span>💨 Vento</span><b id="wind">--</b></div>
        <div class="box" onclick="sb('Visibilità')"><span>👁️ Visib.</span><b>10 <small>k</small></b></div>
    </div>
</div>

<div id="bubble">
    <span style="position:absolute; top:20px; right:25px; color:var(--red); font-weight:900; cursor:pointer;" onclick="closeBubble()">×</span>
    <h3 id="bt" style="color:var(--p); font-size:22px; font-weight:900; margin-bottom:15px;"></h3>
    <p id="bx" style="font-size:17px; font-style:italic; color:#fff;"></p>
</div>

<div id="search" class="panel">
    <div class="close-btn" onclick="t('search',0)">×</div>
    <h2 style="font-size:32px; font-weight:900; margin-bottom:30px;">Cerca</h2>
    <input type="text" id="sIn" style="width:100%; background:#1c1c1e; border:none; padding:20px; border-radius:20px; color:#fff; font-size:18px;" placeholder="Nome città..." oninput="liveSearch(this.value)">
    <div id="sRes"></div>
</div>

<div id="settings" class="panel">
    <div class="close-btn" onclick="t('settings',0)">×</div>
    <h2 style="font-size:32px; font-weight:900; margin-bottom:35px;">Settings</h2>
    <div class="card">
        <div class="ios-item" onclick="toggleUnit()">
            <span>Gradi Fahrenheit (°F)</span>
            <div id="unitSw" class="ios-switch"></div>
        </div>
    </div>
    <div class="card">
        <div class="ios-item" onclick="sbSupport('Bug','Segnalazione inviata.')"><span>Segnala Bug</span><b>〉</b></div>
        <div class="ios-item" onclick="sbSupport('FAQ','Domande frequenti.')"><span>FAQ</span><b>〉</b></div>
    </div>
</div>

<script>
    const K = "92861dce42dbac09fa9bae55f8f38550";
    let isF = false, currData = null, currCond = "Clear";

    const insults = {
        "Clear": ["Sole fuori. Peccato tu sia ancora qui a fissare il telefono.", "Ottimo clima per farsi i fatti propri."],
        "Rain": ["Piove. La scusa perfetta per non fare nulla anche oggi.", "Acqua. I tuoi capelli stanno per dichiarare indipendenza."],
        "Clouds": ["Grigio come le tue prospettive. Sorridi!", "Nuvole. Coprono il sole, mica i tuoi debiti."]
    };

    function t(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
    function closeBubble() { const b = document.getElementById('bubble'); b.classList.remove('show'); setTimeout(()=>b.style.display='none',300); }
    function sb(title) {
        document.getElementById('bt').innerText = title;
        const pool = insults[currCond] || ["Dati ricevuti. Nulla di speciale."];
        document.getElementById('bx').innerText = pool[Math.floor(Math.random()*pool.length)];
        const b = document.getElementById('bubble'); b.style.display='block'; setTimeout(()=>b.classList.add('show'),10);
    }
    function sbSupport(title, text) { document.getElementById('bt').innerText = title; document.getElementById('bx').innerText = text; const b = document.getElementById('bubble'); b.style.display='block'; setTimeout(()=>b.classList.add('show'),10); }

    function toggleUnit() { isF = !isF; document.getElementById('unitSw').classList.toggle('on'); if(currData) render(currData); }
    function conv(t) { return isF ? Math.round((t * 9/5) + 32) : Math.round(t); }

    async function up(c) {
        try {
            const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${c}&appid=${K}&units=metric&lang=it`);
            currData = await r.json();
            render(currData);
            t('search',0);
        } catch(e) {}
    }

    function render(d) {
        currCond = d.weather[0].main;
        document.getElementById('city').innerText = d.name.toUpperCase();
        document.getElementById('temp').innerText = conv(d.main.temp);
        document.getElementById('tMax').innerText = conv(d.main.temp_max) + "°";
        document.getElementById('tMin').innerText = conv(d.main.temp_min) + "°";
        document.getElementById('hum').innerText = d.main.humidity + "%";
        document.getElementById('wind').innerText = Math.round(d.wind.speed * 3.6) + " km/h";
        document.getElementById('desc').innerText = d.weather[0].description.toUpperCase();
        document.getElementById('emoji').innerText = {"Clear":"☀️","Clouds":"🌤️","Rain":"🌧️","Drizzle":"🌦️","Thunderstorm":"⛈️"}[currCond] || "🌤️";
        updateAtmosphere(currCond);
        renderForecast();
    }

    function renderForecast() {
        const W = [
            {d:"Lunedì",e:"☀️",t:24},{d:"Martedì",e:"🌤️",t:22},{d:"Mercoledì",e:"🌧️",t:18},
            {d:"Giovedì",e:"☁️",t:19},{d:"Venerdì",e:"☀️",t:25},{d:"Sabato",e:"☀️",t:26},{d:"Domenica",e:"🌤️",t:23}
        ];
        document.getElementById('forecast').innerHTML = W.map(d => `
            <div class="row-day">
                <div class="day-n">${d.d}</div>
                <div class="day-e">${d.e} Sincronizzato</div>
                <div class="day-t">${conv(d.t)}°</div>
            </div>`).join('');
    }

    function updateAtmosphere(cond) {
        const sky = document.getElementById('sky'), hr = new Date().getHours();
        let g;
        if(cond === "Rain" || cond === "Thunderstorm") g = "radial-gradient(circle at 50% 100%, #1a1a24 0%, #050505 100%)";
        else if(hr < 6 || hr > 20) g = "radial-gradient(circle at 50% 20%, #080812 0%, #000 100%)";
        else if(hr < 10 || hr > 17) g = "radial-gradient(circle at 50% 50%, #ff950022 0%, #05050a 100%)";
        else g = "radial-gradient(circle at 50% 0%, #007aff22 0%, #000 100%)";
        sky.style.background = g;
    }

    function liveSearch(v) {
        const r = document.getElementById('sRes'); r.innerHTML = '';
        const list = ["Barletta", "Roma", "Milano", "Napoli", "Andria", "Trani", "Bari", "Torino"];
        list.filter(c => c.toLowerCase().includes(v.toLowerCase())).forEach(c => {
            const div = document.createElement('div');
            div.style.padding = "18px";
            div.innerHTML = `<b onclick="up('${c}')">${c}</b>`;
            r.appendChild(div);
        });
    }

    up("Barletta");
</script>
</body>
</html>
